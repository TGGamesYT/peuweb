<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peutron</title>
    <link rel="icon" type="image/x-icon" href="img/Peutron.png">
    <style>
        @font-face {
            font-family: 'echo';
            src: url('font/alpha_echo.ttf');
        }
        @font-face {
            font-family: 'pixel';
            src: url('font/pixel.ttf');
        }

        body {
            background-image: url("img/iron.png");
            background-size: 3.125%;
            image-rendering: pixelated;
            margin: 0;
            position: relative;
            display: flow-root;
        }
        #darkbody {
            background-image: url("img/netherite.png");
            background-size: 3.125%;
            image-rendering: pixelated;
            margin: 0;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0; 
            z-index: -1;
            opacity: 0;
            transition: opacity 1s;
        }
        .titel {
            position: relative;
            text-align: center;
        }
        .banner {
            max-width: 100%;
        }
        .title {
            position: absolute;
            font-family: echo;
            color:rgb(28, 75, 28);
            font-size: 15vw;
            margin: 0;
            text-align: center;
            bottom: 0;
            transform: translate(-50%, 25%);
            left: 50%;
        }
        .cardlist {
            
        }
        .card {
            color: #3F3F3F;
            font-family: pixel;
            border-radius: 10px;
            margin: 10%;
            padding: 10%;
            image-rendering: pixelated;
            box-sizing: border-box;
            border-style: solid;
            border-width: 4px;
            border-image-source: url('img/inventory.png');
            border-image-slice: 4 fill;
            border-image-width: 4px;
            border-image-repeat: stretch;
            background-clip: padding-box;
        }
        body.dark-theme .card {
            border-image-source: url('img/dark-inventory.png');
            color: #E0E0E0; /* Lighter text so it's readable in dark mode */
        }
        #clock {
            position: absolute;
            top: 0;
            right: 0;
            width: 10%;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <div id="darkbody"></div>
    <div class="titel">
        <img src="img/nobgbanner.png" alt="Peutron's banner" class="banner">
        <h1 class="title">Peutron</h1>
        <img id="clock" src="img/clock/clock_00.png" onclick="clockclick()">
    </div>
    <div class="cardlist">
        <div class="card">
            Card1
        </div>
        <div class="card">
            Card2
        </div>
    </div>
</body>
    <script>
        let flipped = false;
        let dark = false;
        let clock = document.getElementById("clock");
        let easetime = 0;
        function getTime64() {
            const d = new Date();
            let hours = d.getHours();
            const minutes = d.getMinutes();

            if (flipped) {
                hours = (hours + 12) % 24;
            }

            const totalMinutes = hours * 60 + minutes;
            return String(Math.floor(((totalMinutes + 720) % 1440) / 22.5)).padStart(2, "0");
        }
        function updateClock() {
            let time = getTime64();
            dark = Number(time) > 15 && Number(time) < 47
            if (easetime > 0) {
                time = String((Number(time)+1+easetime) % 64).padStart(2, "0")
                easetime--;
            }
            clock.src = `img/clock/clock_${time}.png`;
        }
        function clockclick() {
            flipped = !flipped;
            easetime = 32;
            updateClock();
            updateDark();
        }
        function updateDark() {
            let darkback = document.getElementById("darkbody") 
            darkback.style.opacity = dark ? 1 : 0;

            if (dark) {
                document.body.classList.add("dark-theme");
            } else {
                document.body.classList.remove("dark-theme");
            }
        }
        updateClock();
        updateDark();
        setInterval(updateClock, 6);
        
    </script>
</html>
