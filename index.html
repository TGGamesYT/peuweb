<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peutron</title>
    <link rel="icon" type="image/x-icon" href="img/Peutron.png">
    <style>
        @font-face {
            font-family: 'echo';
            src: url('font/alpha_echo.ttf');
        }
        @font-face {
            font-family: 'pixel';
            src: url('font/pixel.ttf');
        }

        body {
            background-image: url("img/iron.png");
            background-size: 3.125%;
            image-rendering: pixelated;
            margin: 0;
        }
        .titel {
            position: relative;
            text-align: center;
        }
        .banner {
            max-width: 100%;
        }
        .title {
            position: absolute;
            font-family: echo;
            color:rgb(28, 75, 28);
            font-size: 15vw;
            margin: 0;
            text-align: center;
            bottom: 0;
            transform: translate(-50%, 25%);
            left: 50%;
        }
        .cardlist {
            
        }
        .card {
            color: #3F3F3F;
            font-family: pixel;
            border-radius: 10px;
            margin: 10%;
            padding: 10%;
            image-rendering: pixelated;
            box-sizing: border-box;
            border-style: solid;
            border-width: 4px;
            border-image-source: url('img/inventory.png');
            border-image-slice: 4 fill;
            border-image-width: 4px;
            border-image-repeat: stretch;
            background-clip: padding-box;
     }
    #clock {
        position: absolute;
        top: 0;
        right: 0;
        image-rendering: pixelated;
    }
    </style>
</head>
<body>
    <div class="titel">
        <img src="img/nobgbanner.png" alt="Peutron's banner" class="banner">
        <h1 class="title">Peutron</h1>
        <img id="clock" src="img/clock/clock_00.png">
    </div>
    <div class="cardlist">
        <div class="card">
            Card1
        </div>
        <div class="card">
            Card2
        </div>
    </div>
</body>
    <script>
        function getTime64() {
              const d = new Date();
              const minutes = d.getHours() * 60 + d.getMinutes();
              return String(Math.floor(((minutes + 720) % 1440) / 22.5)).padStart(2, "0");
        }
        let clock = document.getElementById("clock");
        clock.src = `img/clock/clock_${getTime64()}.png`;
    </script>
</html>
