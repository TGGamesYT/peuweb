<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peutron</title>
    <link rel="icon" type="image/x-icon" href="img/Peutron.png">
    <style>
        @font-face {
            font-family: 'echo';
            src: url('font/alpha_echo.ttf');
        }
        @font-face {
            font-family: 'pixel';
            src: url('font/pixel.ttf');
        }

        body {
            background-image: url("img/iron.png");
            background-size: 3.125%;
            image-rendering: pixelated;
            margin: 0;
            position: relative;
            display: flow-root;
        }
        #darkbody {
            background-image: url("img/netherite.png");
            background-size: 3.125%;
            image-rendering: pixelated;
            margin: 0;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0; 
            z-index: -1;
            opacity: 0;
            transition: opacity 1s;
        }
        .titel {
            position: relative;
            text-align: center;
        }
        .banner {
            max-width: 100%;
        }
        .title {
            position: absolute;
            font-family: echo;
            color: rgb(28, 75, 28);
            font-size: 15vw;
            margin: 0;
            text-align: center;
            bottom: 0;
            transform: translate(-50%, 25%);
            left: 50%;
            transition: color 1s;
        }
        
        /* 
          EDIT EVERYTHING YOU WANT ABOUT THE CARDS HERE.
          You never have to touch .dark-card ever again.
        */
        .card {
            color: #3F3F3F;
            font-family: pixel;
            border-radius: 10px;
            margin: 10%;
            padding: 10%;
            image-rendering: pixelated;
            box-sizing: border-box;
            border-style: solid;
            border-width: 4px;
            border-image-source: url('img/inventory.png');
            border-image-slice: 4 fill;
            border-image-width: 4px;
            border-image-repeat: stretch;
            background-clip: padding-box;
            
            position: relative;
            z-index: 1;
            transition: color 1s;
        }
        
        /* Background overlay handler—ignore this completely from now on */
        .dark-card {
            position: absolute;
            top: -4px; 
            bottom: -4px;
            left: -4px;
            right: -4px;
            border-style: solid;
            border-width: 4px;
            border-image-source: url('img/dark-inventory.png');
            border-image-slice: 4 fill;
            border-image-width: 4px;
            border-image-repeat: stretch;
            background-clip: padding-box;
            z-index: -1; 
            opacity: 0;
            transition: opacity 1s;
        }
        
        #clock {
            position: absolute;
            top: 0;
            right: 0;
            width: 10%;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <div id="darkbody"></div>
    <div class="titel">
        <img src="img/nobgbanner.png" alt="Peutron's banner" class="banner">
        <h1 class="title">Peutron</h1>
        <img id="clock" src="img/clock/clock_00.png" onclick="clockclick()">
    </div>
    <div class="cardlist">
        <div class="card">
            <div class="dark-card"></div> 
            Card1
        </div>
        <div class="card">
            <div class="dark-card"></div>
            Card2
        </div>
    </div>
</body>
    <script>
        let flipped = false;
        let dark = false;
        let clock = document.getElementById("clock");
        let easetime = 0;
        
        let darkback = document.getElementById("darkbody");
        let cards = document.querySelectorAll(".card");
        let darkCards = document.querySelectorAll(".dark-card");
        let titele = document.querySelector(".title");

        function getTime64() {
            const d = new Date();
            let hours = d.getHours();
            const minutes = d.getMinutes();

            if (flipped) {
                hours = (hours + 12) % 24;
            }

            const totalMinutes = hours * 60 + minutes;
            return String(Math.floor(((totalMinutes + 720) % 1440) / 22.5)).padStart(2, "0");
        }
        
        function updateClock() {
            let time = getTime64();
            dark = Number(time) > 15 && Number(time) < 47;
            if (easetime > 0) {
                time = String((Number(time)+1+easetime) % 64).padStart(2, "0");
                easetime--;
            }
            clock.src = `img/clock/clock_${time}.png`;
        }
        
        function clockclick() {
            flipped = !flipped;
            easetime = 32;
            updateClock();
            updateDark();
        }
        
        function updateDark() {
            darkback.style.opacity = dark ? 1 : 0;
            
            darkCards.forEach(dc => {
                dc.style.opacity = dark ? 1 : 0;
            });
            
            cards.forEach(c => {
                c.style.color = dark ? "#E0E0E0" : "#3F3F3F";
            });

            titele.style.color = dark ? "rgb(120, 220, 120)" : "rgb(28, 75, 28)";
        }
        
        updateClock();
        updateDark();
        setInterval(updateClock, 31);
    </script>
</html>
